name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}, Julia ${{ matrix.julia }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
        julia: ['1']
        include:
          - os: ubuntu-latest
            python: '3.9'
            julia: 'lts'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Julia environment with SciBmad and PythonCall
        # (SciBmad's precompile workload is turned off: it takes long and is not tested here)
        shell: bash
        run: |
          mkdir -p jlenv
          printf '[SciBmad]\nprecompile_workload = false\n' > jlenv/LocalPreferences.toml
          julia --project=jlenv -e 'using Pkg; Pkg.add(["SciBmad", "PythonCall"]); Pkg.precompile()'
      - name: Install the Python package
        run: python -m pip install -e ".[test]"
      - name: Test
        shell: bash
        run: |
          # (the path of the executable as Julia gives it: on Windows, bash's `which` gives an
          # MSYS path that Python does not understand)
          export SCIBMAD_JULIA="$(julia -e 'print(joinpath(Sys.BINDIR, Base.julia_exename()))')"
          export SCIBMAD_PROJECT="$(julia -e 'print(abspath("jlenv"))')"
          python -m pytest -v
