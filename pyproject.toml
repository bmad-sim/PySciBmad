[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyscibmad"
dynamic = ["version"]
description = "SciBmad from Python: charged particle beam dynamics (Twiss, tracking, normal forms, optimization) on CPUs and GPUs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "The SciBmad developers" }]
keywords = ["accelerator", "physics", "beam dynamics", "twiss", "tracking", "bmad", "scibmad"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  # juliacall runs Julia inside Python; with it comes juliapkg, which installs Julia and
  # SciBmad.jl (src/scibmad/juliapkg.json) when no SciBmad distribution is found
  "juliacall >=0.9.24",
  "numpy >=1.21",
]

[project.optional-dependencies]
plot = ["matplotlib"]
test = ["pytest >=7", "matplotlib", "scipy"]

[project.scripts]
scibmad-py = "scibmad.__main__:main"

[project.urls]
Homepage = "https://github.com/bmad-sim/PySciBmad"
Documentation = "https://bmad-sim.github.io/SciBmad.jl"
Repository = "https://github.com/bmad-sim/PySciBmad"
Issues = "https://github.com/bmad-sim/PySciBmad/issues"
"SciBmad.jl" = "https://github.com/bmad-sim/SciBmad.jl"

[tool.hatch.version]
path = "src/scibmad/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/scibmad"]

[tool.hatch.build.targets.wheel.force-include]
"src/scibmad/juliapkg.json" = "scibmad/juliapkg.json"
"src/scibmad/_glue.jl" = "scibmad/_glue.jl"

[tool.pytest.ini_options]
testpaths = ["tests"]
