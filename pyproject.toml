[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scibmad"
version = "0.1.0"
description = "Python interface to the SciBmad.jl accelerator physics simulation ecosystem"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "The SciBmad developers" },
]
keywords = ["accelerator", "physics", "simulation", "beam", "twiss", "bmad"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # juliacall provides the Julia runtime bridge and pulls in juliapkg,
    # which reads scibmad/juliapkg.json to install the LTS Julia + SciBmad.jl.
    "juliacall >=0.9.20",
]

[project.optional-dependencies]
test = ["pytest >=7"]

[project.urls]
# These must point at the Python package's own repo: PyPI renders them in the
# sidebar, and bug reports about `scibmad` belong on PySciBmad's tracker, not
# SciBmad.jl's.
Homepage = "https://github.com/bmad-sim/PySciBmad"
Documentation = "https://github.com/bmad-sim/PySciBmad/blob/main/docs/index.html"
Repository = "https://github.com/bmad-sim/PySciBmad"
Issues = "https://github.com/bmad-sim/PySciBmad/issues"
"SciBmad.jl (Julia)" = "https://github.com/bmad-sim/SciBmad.jl"

[tool.hatch.build.targets.wheel]
packages = ["src/scibmad"]

# Ship the Julia dependency manifest inside the package so juliapkg finds it.
[tool.hatch.build.targets.wheel.force-include]
"src/scibmad/juliapkg.json" = "scibmad/juliapkg.json"
"src/scibmad/_glue.jl" = "scibmad/_glue.jl"
